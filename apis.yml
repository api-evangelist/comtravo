name: Comtravo
description: 'Comtravo was a Berlin-based business travel management company (a TMC) that
  combined booking technology with human travel agents to handle corporate flights, hotels,
  rail and expense workflows for European businesses. It was backed by Creandum and other
  investors. As of this enrichment pass the standalone company is no longer operating: the
  comtravo.com domain returns a 301 redirect to navan.com, consistent with Comtravo having
  been acquired/wound into Navan (formerly TripActions). No independent Comtravo developer
  portal, API documentation, OpenAPI, or public API surface could be found, so this profile
  is retained as a historical/defunct record rather than an active API provider.'
